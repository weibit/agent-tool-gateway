[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tool-gateway"
version = "0.1.0"
description = "In-process authorization, risk scoring, rate limiting and guardrails at the tool-call boundary of AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bit" }]
keywords = ["ai-agents", "authorization", "guardrails", "mcp", "tool-calling", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
jsonschema = ["jsonschema>=4.0"]
claude = ["claude-agent-sdk"]
openai = ["openai-agents>=0.22,<0.23"]
pydantic = ["pydantic-ai-slim>=2.38,<2.39"]
langgraph = ["langgraph>=1.2,<2", "langchain-core>=1.6,<2"]
dev = [
  "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "jsonschema>=4.0",
  "openai-agents>=0.22,<0.23", "pydantic-ai-slim>=2.38,<2.39",
  "langgraph>=1.2,<2", "langchain-core>=1.6,<2", "langchain>=1.4,<2",
]

[project.urls]
Homepage = "https://github.com/weibit/agent-tool-gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_tool_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
